<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}a{color:#1C1410;text-decoration:none}a:hover{color:#1C1410}
@media (min-width:1200px){[data-h1]{white-space:nowrap}}
@media (max-width:720px){
[data-pad]{padding-left:20px!important;padding-right:20px!important}
[data-h1]{font-size:28px!important;font-weight:300!important;line-height:1.2!important}
[data-prompt]{font-size:14px!important;margin-top:10px!important}
[data-list]{margin-top:24px!important;gap:6px!important}
[data-row]{grid-template-columns:minmax(0,1fr) 16px!important;height:auto!important;min-height:56px;padding:11px 16px 11px 18px!important;border-radius:20px!important;background:#FAF8F3!important;gap:2px 12px!important}
[data-name]{font-size:15px!important;font-weight:400!important}
[data-desc]{grid-column:1;white-space:normal!important;font-size:12px!important;color:#8A7F74!important;line-height:1.4}
[data-arrow]{grid-column:2;grid-row:1 / 3;width:auto!important;height:auto!important;background:none!important}
[data-arrow] svg{stroke:#8A7F74}
[data-links]{display:none!important}
[data-glow]{opacity:0.1!important;width:470px!important;height:240px!important;margin-left:-235px!important;top:80px!important}
}
</style>
</helmet>
<div style="font-family:'Poppins',sans-serif;color:#1C1410;background:#FFFFFF">
  <div style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden">
    <div data-glow="1" style="position:absolute;left:50%;top:150px;width:760px;height:340px;margin-left:-380px;border-radius:50%;background:#FFCC00;opacity:0.16;filter:blur(90px);pointer-events:none"></div>
    <header data-pad="1" style="position:relative;height:clamp(56px,8vh,80px);flex:none;padding:0 72px;display:flex;align-items:center">
      <a href="#" style="font-size:19px;font-weight:600;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px"><span style="width:12px;height:12px;border-radius:50%;background:#FFCC00;display:block"></span>Pitchvilla</a>
    </header>
    <main data-pad="1" style="position:relative;flex:1;padding:clamp(4px,1.5vh,16px) 72px clamp(16px,4vh,56px);display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="opacity:{{ intro.o }};transform:translateY({{ intro.y }}px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column;align-items:center;max-width:100%">
        <h1 data-h1="1" style="margin:0;font-size:clamp(28px,min(3.5vw,5.6vh),50px);line-height:1.1;font-weight:400;letter-spacing:-0.035em;text-align:center;text-wrap:balance">Everything a founder needs to start, fund and scale.</h1>
        <p data-prompt="1" style="margin:clamp(6px,1.4vh,14px) 0 0;font-size:clamp(15px,1.9vh,17px);color:#8A7F74">What are you here for?</p>
      </div>
      <div data-list="1" style="margin-top:clamp(16px,4vh,40px);width:100%;max-width:760px;display:flex;flex-direction:column;gap:clamp(4px,0.8vh,8px)">
        <sc-for list="{{ branches }}" as="b" hint-placeholder-count="8">
          <div style="opacity:{{ b.o }};transform:translateY({{ b.y }}px);transition:opacity .7s ease {{ b.d }}ms,transform .7s cubic-bezier(.22,.61,.36,1) {{ b.d }}ms">
            <a data-row="1" href="{{ b.href }}" style="background:#F6F3EC;border-radius:999px;padding:0 8px 0 28px;height:clamp(44px,6.2vh,58px);display:grid;grid-template-columns:230px minmax(0,1fr) 38px;align-items:center;gap:20px;cursor:pointer;transition:background .3s ease,transform .3s cubic-bezier(.22,.61,.36,1)" style-hover="background:#FFCC00;transform:translateX(4px)" style-active="background:#FFCC00;transform:scale(0.99)">
              <span data-name="1" style="font-size:17px;font-weight:500;letter-spacing:-0.015em;line-height:1.25">{{ b.name }}</span>
              <span data-desc="1" style="min-width:0;font-size:13px;color:#6B6057;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ b.desc }}</span>
              <span data-arrow="1" style="width:clamp(30px,4.2vh,38px);height:clamp(30px,4.2vh,38px);border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#1C1410" stroke-width="1.6"><path d="M3 8h10M9 4l4 4-4 4"></path></svg></span>
            </a>
          </div>
        </sc-for>
      </div>
      <a href="#" style="margin-top:clamp(8px,2.4vh,28px);min-height:44px;font-size:15px;color:#6B6057;display:flex;gap:8px;align-items:center" style-hover="color:#1C1410">Not sure? <span style="color:#1C1410;font-weight:500;text-decoration:underline;text-decoration-color:#FFCC00;text-decoration-thickness:2px;text-underline-offset:5px">Talk to us</span></a>
    </main>
  </div>
  <footer data-pad="1" style="background:#F6F3EC;padding:36px 72px 28px;display:flex;flex-direction:column;gap:24px;font-size:13px;color:#6B6057">
    <div style="display:flex;justify-content:space-between;gap:24px 48px;align-items:center;flex-wrap:wrap">
      <a href="#" style="font-size:17px;font-weight:600;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:#FFCC00;display:block"></span>Pitchvilla</a>
      <div data-links="1" style="flex:1;max-width:760px;display:flex;flex-wrap:wrap;gap:12px 28px">
        <sc-for list="{{ branches }}" as="b" hint-placeholder-count="8"><a href="{{ b.href }}" style="color:#4A3F37" style-hover="color:#1C1410">{{ b.name }}</a></sc-for>
        <a href="About.dc.html" style="color:#4A3F37">About</a><a href="Blog.dc.html" style="color:#4A3F37">Blog</a>
      </div>
      <div style="display:flex;gap:6px"><sc-for list="{{ socials }}" as="s" hint-placeholder-count="4"><a href="#" aria-label="{{ s.label }}" style="width:40px;height:40px;border-radius:50%;background:#FFFFFF;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center" style-hover="background:#FFCC00">{{ s.short }}</a></sc-for></div>
    </div>
    <div style="display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;font-size:12px"><span>© 2026 Pitchvilla</span><div style="display:flex;gap:24px"><a href="#" style="color:#6B6057">Privacy</a><a href="#" style="color:#6B6057">Terms</a><a href="#" style="color:#6B6057">Cookies</a></div></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { shown: false };
  componentDidMount() { this.t = setTimeout(() => this.setState({ shown: true }), 80); }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const on = this.state.shown;
    const b = [
      ["100X Forge", "Startup Founders Cohort Program", "Pitchvilla Website v4.dc.html"],
      ["Consulting Group", "For Startups, SMEs & Businesses to Reinvent & Scale", "Pitchvilla Consulting Group.dc.html"],
      ["Funding", "Connect with Angel & Seed Investors", "#"],
      ["Technology Framework", "In-house Tech Products for Startups", "#"],
      ["Events", "Founder & Business Community Events", "#"],
      ["Talent", "Hiring, Leadership & Fractional CXO Solutions", "#"],
      ["Ventures", "Investment & Strategic Business Opportunities", "#"],
      ["Growth Lab", "Marketing, Sales & Revenue Acceleration", "#"]
    ];
    return {
      intro: { o: on ? 1 : 0, y: on ? 0 : 14 },
      branches: b.map(([name, desc, href], i) => ({ name, desc, href, o: on ? 1 : 0, y: on ? 0 : 12, d: 250 + i * 60 })),
      socials: [{ label: "LinkedIn", short: "in" }, { label: "Instagram", short: "ig" }, { label: "X", short: "x" }, { label: "YouTube", short: "yt" }]
    };
  }
}
</script>
</body>
</html>
